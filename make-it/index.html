<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/make-it/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="make_it">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <script>
    (() => {
      const glyph = "🥣";
      const isEmoji = true;
      const drawTabIcon = () => {
        const size = 64;
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const context = canvas.getContext("2d");
        if (!context) {
          return;
        }
        context.fillStyle = "#1A8E5F";
        context.fillRect(0, 0, size, size);
        context.strokeStyle = "rgba(255, 255, 255, 0.32)";
        context.lineWidth = 3;
        context.strokeRect(1.5, 1.5, size - 3, size - 3);
        context.fillStyle = "#FFFFFF";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.font = isEmoji
          ? '44px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif'
          : "900 46px Arial, sans-serif";
        context.fillText(glyph, size / 2, size / 2 + (isEmoji ? 1 : 2));
        const favicon = document.querySelector('link[rel="icon"][type="image/png"]');
        if (favicon) {
          favicon.href = canvas.toDataURL("image/png");
        }
      };
      drawTabIcon();
    })();
  </script>

  <title>make_it</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
